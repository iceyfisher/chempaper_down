[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-download-tool"
version = "0.2.0"
description = "Crash-isolated, extensible DOI-to-paper/SI downloader with browser adapters, Web UI, CLI and AI-agent API"
requires-python = ">=3.11"
dependencies = [
  "pydoll-python>=2.23.1,<3",
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.1.0,<2",
  "httpx>=0.28.0",
  "psutil>=6.1.0"
]

[project.scripts]
paper-tool = "paper_tool.cli:main"
paper-tool-server = "paper_tool.api:main"
paper-tool-agent = "paper_tool.agent_client:main"
paper-tool-worker = "paper_tool.worker_main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["paper_tool*"]

[tool.setuptools.package-data]
paper_tool = ["static/*.html"]
